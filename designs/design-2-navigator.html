<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lootwise · design 2 · Navigator</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#f1f3ee; --surface:#ffffff; --raised:#f6f7f4; --active:#e6e9e3;
  --border:#e3e6e0; --rule:#eef0ec; --control:#c9ccc5;
  --text:#131416; --muted:#5b5e5c; --accent:#1b6c80; --accent-ink:#13505f;
  --positive:#1e7b4f; --negative:#c4242a; --warning:#92400e;
  --pill-positive-bg:#dcfae5; --pill-positive-ink:#04250e;
  --pill-negative-bg:#ffedea; --pill-negative-ink:#831c1e;
  --pill-warning-bg:#fffbeb; --pill-warning-ink:#92400e; --warn-border:#fde68a;
  --pill-neutral-bg:#e6e9e3; --pill-neutral-ink:#353736;
  --r-card:8px; --r-control:6px; --r-sheet:16px; --gap:24px; --pad:24px;
  --font:"IBM Plex Sans",Inter,system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0}
html{background:#dcdfd8}
body{font:400 14px/20px var(--font);color:var(--text);font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}

/* demo stage ------------------------------------------------------ */
.viewer{width:100%;overflow:hidden;padding:16px 16px 20px}
.stage{width:1280px;margin:0 auto}
.demo{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin-bottom:12px;align-items:center}
.demo h1{grid-column:1/-1;font-size:14px;font-weight:600;display:flex;gap:10px;align-items:baseline}
.demo h1 span{font-weight:400;color:var(--muted)}
.demo .lbl{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{height:26px;padding:0 10px;border-radius:6px;font-size:12px;color:#3d403e;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{background:#cfd3cb}
.chip[aria-current=true]{background:#131416;color:#fff}
.chip .kc{opacity:.7}
.winwrap{width:1280px;height:800px;position:relative;border-radius:12px;overflow:hidden;border:1px solid #c5c9c0;background:var(--ground)}
.legend{margin-top:10px;font-size:12px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}
.kc{font:500 11px/16px var(--mono);border:1px solid var(--control);border-radius:4px;padding:0 5px;color:var(--muted);background:var(--surface);display:inline-block;min-width:18px;text-align:center}
.chip[aria-current=true] .kc{background:transparent;color:#d8dbd5;border-color:#6a6d6b}

/* app shell: tinted L-frame, white sheet inset 8px ----------------- */
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:48px 1fr;width:1280px;height:798px;background:var(--ground)}
.side{grid-row:1/3;display:flex;flex-direction:column;padding:14px 10px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;height:36px}
.mark{width:26px;height:26px;flex:none}
.brand b{font-weight:600;font-size:15px}
.scopeline{padding:2px 8px 14px 44px;font-size:12px;color:var(--muted);margin-top:-6px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{height:34px;display:flex;align-items:center;gap:10px;padding:0 8px;border-radius:8px;color:#454846;text-align:left;width:100%}
.nav button:hover{background:#e9ece6}
.nav button[aria-current=page]{background:var(--active);color:var(--text);font-weight:500}
.nav button svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.nav button .kc{margin-left:auto;background:transparent;border-color:transparent}
.nav button:hover .kc,.nav button[aria-current=page] .kc{border-color:var(--control);background:var(--surface)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.live{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:10px 12px;text-align:left;width:100%;display:block}
.live:hover{border-color:var(--control)}
.live .t{display:flex;align-items:center;gap:8px;font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--positive);flex:none}
.dot.off{background:#9a9d98}.dot.warn{background:#b45309}
.live .s{font-size:12px;color:var(--muted);margin-top:2px}
.acct{padding:0 8px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.top{display:flex;align-items:center;gap:12px;padding:0 16px 0 20px}
.sel{height:32px;border:1px solid var(--control);background:var(--surface);border-radius:var(--r-control);padding:0 10px;display:inline-flex;align-items:center;gap:8px;font-size:14px}
.sel svg{width:12px;height:12px;stroke:var(--muted);fill:none;stroke-width:1.5}
.top .sp{margin-left:auto}
.stamp{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:8px}
.sheet{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sheet);margin:0 8px 8px 0;overflow:auto;padding:24px var(--pad) 24px;position:relative}
.sheet.flush{padding:0;display:grid;grid-template-columns:420px 1fr;overflow:hidden}
.titlerow{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px}
.titlerow h2{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.01em}
.titlerow p{color:var(--muted);margin-top:2px}
.titlerow .act{margin-left:auto;display:flex;gap:8px}
h3{font-size:16px;line-height:22px;font-weight:600}
.btn{height:32px;padding:0 12px;border-radius:var(--r-control);border:1px solid var(--control);background:var(--surface);display:inline-flex;align-items:center;gap:8px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:#8c8f8a}
.btn.primary{background:#1d1f20;border-color:#1d1f20;color:#fff}
.btn.primary:hover{background:#34373a}
.btn.sm{height:28px;padding:0 10px;font-size:13px}
.btn[disabled]{color:#6b6e6b;background:var(--raised);border-color:var(--border);cursor:not-allowed}
.link{color:var(--accent-ink);font-weight:500}
.link:hover{text-decoration:underline}
.card{border:1px solid var(--border);border-radius:var(--r-card);padding:20px;background:var(--surface)}
.card>header{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.card>header .r{margin-left:auto;font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:baseline}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:var(--gap)}
.grid2+.grid2{margin-top:var(--gap)}
.fig{font-size:32px;line-height:38px;font-weight:500;letter-spacing:-.01em}
u{text-decoration:none}
.fig u,.fig2 u,.u{text-decoration:none;font-size:14px;color:var(--muted);font-weight:400;letter-spacing:0;margin-left:4px}
.fig2{font-size:24px;line-height:30px;font-weight:500}
.delta{font-size:13px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;flex:none;white-space:nowrap;background:var(--pill-neutral-bg);color:var(--pill-neutral-ink)}
.pill.pos{background:var(--pill-positive-bg);color:var(--pill-positive-ink)}
.pill.warn{background:var(--pill-warning-bg);color:var(--pill-warning-ink);border:1px solid var(--warn-border)}
.pill.neg{background:var(--pill-negative-bg);color:var(--pill-negative-ink)}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--border);border-radius:8px;padding:2px;gap:2px}
.seg button{height:26px;padding:0 10px;border-radius:6px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--text);font-weight:500;border:1px solid var(--border)}
.notice{border:1px solid var(--warn-border);background:var(--pill-warning-bg);color:var(--pill-warning-ink);border-radius:8px;padding:8px 12px;font-size:13px;display:flex;gap:12px;align-items:center;margin-bottom:16px}
.notice .link{color:var(--pill-warning-ink);text-decoration:underline;margin-left:auto}
.notice.in{margin-bottom:12px}
.empty{border:1px dashed var(--control);border-radius:8px;min-height:38px;display:flex;align-items:center;justify-content:center;color:var(--muted);padding:8px 14px;text-align:center}

/* lists / tables */
.rows{display:flex;flex-direction:column}
.row{display:grid;align-items:center;column-gap:12px;min-height:44px;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r{text-align:right}
table{border-collapse:collapse;width:100%}
th{font-size:12px;font-weight:400;color:var(--muted);text-align:left;height:36px;padding:0 0 0 0;white-space:nowrap}
th.r,td.r{text-align:right}
td{height:40px;border-top:1px solid var(--rule);padding:0}
thead th{border-bottom:1px solid var(--border)}
tbody tr:first-child td{border-top:0}
.sort{font-size:10px;margin-left:4px;color:var(--text)}
.gr td{color:var(--muted)}
.bar{height:2px;background:var(--rule);margin-top:6px;position:relative;border-radius:1px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:#b5b9b3;border-radius:1px}
.bar i.top{background:var(--accent)}
.sk{display:inline-block;background:#e4e6e1;border-radius:4px;vertical-align:middle}

/* master-detail */
.master{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.master .hd{padding:24px 20px 12px}
.master .hd h2{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.01em}
.master .hd p{color:var(--muted);margin:2px 0 14px}
.mlist{overflow:auto;padding:0 10px 14px;flex:1}
.mrow{display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:center;padding:0 10px;height:52px;border-radius:8px;width:100%;text-align:left}
.mrow:hover{background:var(--raised)}
.mrow[aria-selected=true]{background:var(--active)}
.mrow .n{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .s{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .v{text-align:right;font-weight:500}
.mrow .v small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.detail{overflow:auto;padding:28px var(--pad) 24px;min-width:0}
.dgrid{display:grid;grid-template-columns:auto 1fr;gap:var(--gap)}
.well{background:var(--raised);border-radius:8px;padding:6px 16px}
.kv{display:flex;justify-content:space-between;gap:16px;min-height:32px;align-items:center;border-top:1px solid var(--rule)}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--muted)}
.hint{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center}

/* settings */
.fld{height:32px;border:1px solid var(--control);background:#fff;border-radius:var(--r-control);padding:0 10px;display:inline-flex;align-items:center;gap:6px}
.sw{width:28px;height:16px;border-radius:8px;background:#9a9d98;position:relative;flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;background:#fff;border-radius:50%}
.sw.on{background:#1d1f20}.sw.on::after{left:14px}
.cb{width:16px;height:16px;border:1.5px solid #6b6e6b;border-radius:3px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:#fff}
.cb.on{background:#1d1f20;border-color:#1d1f20}
.cb.on::after{content:"";width:8px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.sec{display:grid;grid-template-columns:260px 1fr;gap:32px;padding:20px 0;border-top:1px solid var(--rule)}
.sec:first-child{border-top:0;padding-top:0}
.sec .l p{color:var(--muted);margin-top:4px}
.panel{background:#f8f9f6;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.prow{display:flex;align-items:center;gap:12px;min-height:32px}
.prow .t{font-weight:500}
.prow .d{color:var(--muted);font-size:13px}
.prow .end{margin-left:auto;display:flex;gap:8px;align-items:center}
.steps{display:flex;flex-direction:column;gap:var(--gap);max-width:760px}
.step{display:grid;grid-template-columns:28px 1fr;gap:16px}
.step .ix{width:28px;height:28px;border-radius:50%;border:1px solid var(--control);display:flex;align-items:center;justify-content:center;font-weight:500;font-size:13px}
.step.cur .ix{background:#1d1f20;color:#fff;border-color:#1d1f20}
.step .b{display:flex;flex-direction:column;gap:12px}
.step .b>p{color:var(--muted)}
.prog{height:4px;border-radius:2px;background:var(--rule);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.tabrow{display:grid;grid-template-columns:20px 1fr auto;column-gap:12px;align-items:center;min-height:44px;padding:0 10px;border-radius:8px;width:100%;text-align:left}
.tabrow:hover{background:var(--raised)}
.tabrow[aria-selected=true]{background:var(--active)}
.tabrow .cbx{display:flex}

/* ---------- overlay card (the product's own surface) ---------- */
.ocard{width:320px;background:#fff;border:1px solid #cfd3cb;border-radius:12px;padding:16px;box-shadow:0 8px 24px rgba(19,20,22,.22);color:var(--text);font-size:14px;text-align:left;display:flex;flex-direction:column;gap:12px}
.ocard .nm{font-size:16px;line-height:22px;font-weight:600}
.ocard .sub{font-size:12px;color:var(--muted);margin-top:1px}
.ocard .pr{display:flex;align-items:baseline;gap:14px}
.ocard .pr .big{font-size:30px;line-height:34px;font-weight:500;letter-spacing:-.01em}
.ocard .pr .big u{font-size:14px;color:var(--muted);text-decoration:none;margin-left:4px;letter-spacing:0}
.ocard .pr .dv{font-size:18px;font-weight:500;margin-left:auto;text-align:right}
.ocard .pr .dv u{font-size:12px;color:var(--muted);text-decoration:none;margin-left:4px;font-weight:400}
.ocard .meta{border-top:1px solid var(--rule)}
.ocard .meta .kv{min-height:30px}
.ocard .foot{display:flex;align-items:center;gap:10px;border-top:1px solid var(--rule);padding-top:10px;margin-top:-2px}
.ocard .foot .kc{margin-left:auto}
.ocard .trend{display:flex;flex-direction:column;gap:4px}
.ocard .trend .tt{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.ocard .msg{background:var(--raised);border-radius:8px;padding:12px;color:var(--text)}
.ocard .msg b{display:block;font-weight:600;margin-bottom:2px}
.ocard .msg.warnmsg{background:var(--pill-warning-bg);border:1px solid var(--warn-border);color:var(--pill-warning-ink)}
.ocard .filt{display:grid;grid-template-columns:16px 1fr auto;column-gap:10px;align-items:center;min-height:34px;border-top:1px solid var(--rule)}
.ocard .filt.off{color:var(--muted)}
.ocard .filt .roll{font-size:12px;color:var(--muted);display:block}
.ocard .nf{height:26px;min-width:52px;border:1px solid var(--control);border-radius:6px;padding:0 8px;display:inline-flex;align-items:center;justify-content:flex-end;font-weight:500;background:#fff}
.ocard .off .nf{background:var(--raised);border-color:var(--border);color:#6b6e6b}
.ocard .gemrow{display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:center;min-height:50px;border-top:1px solid var(--rule)}
.ocard .gemrow:first-of-type{border-top:0}
.ocard .gemrow .n{font-weight:500}
.ocard .gemrow .s{font-size:12px;color:var(--muted)}
.ocard .gemrow .v{text-align:right;font-weight:500}
.ocard .gemrow .v small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.ocard .gemrow.best{background:var(--raised);margin:0 -16px;padding:0 16px;border-top-color:transparent}
.ocard .gemrow.unk .n{color:var(--muted);font-weight:400}
.ocard .btns{display:flex;gap:8px}
.ocard .btns .btn{flex:1;justify-content:center}
.hist-pane{display:grid;grid-template-columns:368px 1fr;gap:var(--gap);align-items:start}
.hist-pane .kv span{white-space:nowrap}
.cardwell{background:var(--ground);border-radius:12px;padding:24px;display:flex;justify-content:center;flex:none}
.cardwell .ocard{box-shadow:none}

/* game stand-in */
.game{position:absolute;inset:0;background:#15171b;overflow:hidden}
.game svg.bg{position:absolute;inset:0}
.gamecard{position:absolute}
.gamehud{position:absolute;left:180px;bottom:18px;font-size:12px;color:#8e929a}
.esc{position:absolute;right:20px;bottom:16px;font-size:12px;color:#8e929a;display:flex;gap:8px;align-items:center}
.esc .kc{background:transparent;border-color:#4a4e55;color:#aab}
.skeleton-line{height:14px}
.sr{position:absolute;left:-9999px}
</style>
</head>

</div></div>

function mkSession(id,date,start,end,first,last,tabsA,tabsB,running){
  const mins = mm(end)-mm(start), n = mins/10+1;
  const snaps=[];
  const wob=[0,.06,.15,.19,.31,.38,.47,.55,.66,.71,.84,.93];
  for(let i=0;i<n;i++){const f=i===0?0:i===n-1?1:Math.min(.98,(i/(n-1))+(Math.sin(i*2.1)*.035));
    snaps.push({t:hm(mm(start)+i*10),v:i===0?first:i===n-1?last:Math.round(first+(last-first)*f),tabs:i<n/2?tabsA:tabsB});}
  snaps[0].tabs=tabsA; snaps[n-1].tabs=tabsB;
  const mixed = tabsA!==tabsB;
  return {id,date,start,end,first,last,mins,snaps,gain:last-first,perHour:(last-first)/(mins/60),mixed,tabsA,tabsB,running};
}

function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,1.5,2,2.5,3,4,5,6,8,10]) if(m*p>=v) return m*p;return v}
/* line chart on a real time axis (minutes). pts: [{x, y}] */
function lineChart({w,h,pts,xticks,yfmt=f0,ymax,annot,min=0,color='var(--accent)',flat=false}){
  const L=54,R=10,T=annot?22:8,B=22,pw=w-L-R,ph=h-T-B;
  const x0=pts[0].x,x1=pts[pts.length-1].x;
  const ym=ymax||niceMax(Math.max(...pts.map(p=>p.y))*1.02);
  const X=x=>L+(x-x0)/(x1-x0)*pw, Y=y=>T+ph-(y-min)/(ym-min)*ph;
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Net worth over time">`;
  const n=4;
  for(let i=0;i<=n;i++){const v=min+(ym-min)*i/n,y=Y(v);
    s+=`<line x1="${L}" x2="${w-R}" y1="${y}" y2="${y}" stroke="${i===0?'#9da099':'#e5e7e2'}" stroke-width="1"/>`;
    s+=`<text x="${L-8}" y="${y+4}" text-anchor="end" font-size="12" fill="#5b5e5c">${yfmt(v)}</text>`;}
  xticks.forEach((t,i)=>{const x=X(t.x);const a=i===0?'start':i===xticks.length-1?'end':'middle';
    s+=`<text x="${x}" y="${h-4}" text-anchor="${a}" font-size="12" fill="#5b5e5c">${t.l}</text>`;});
  s+=`<polyline fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" points="${pts.map(p=>X(p.x).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ')}"/>`;
  const e=pts[pts.length-1];
  s+=`<circle cx="${X(e.x)}" cy="${Y(e.y)}" r="4" fill="${color}" stroke="#fff" stroke-width="2"/>`;
  if(annot){const ax=X(annot.x);s+=`<line x1="${ax}" x2="${ax}" y1="${T-6}" y2="${T+ph}" stroke="#131416" stroke-width="1" stroke-dasharray="3 3"/><text x="${ax-6}" y="${T-9}" text-anchor="end" font-size="12" fill="#131416">${annot.l}</text>`;}
  return s+'</svg>';
}
function trend(series,w=288,h=44){
  const mn=Math.min(...series),mx=Math.max(...series),p=4;
  const X=i=>p+i/(series.length-1)*(w-2*p),Y=v=>p+(h-2*p)-(v-mn)/((mx-mn)||1)*(h-2*p);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="7-day price trend"><line x1="0" x2="${w}" y1="${h-.5}" y2="${h-.5}" stroke="#e5e7e2"/><polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round" points="${series.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/><circle cx="${X(series.length-1)}" cy="${Y(series[series.length-1])}" r="3.5" fill="var(--accent)" stroke="#fff" stroke-width="1.5"/></svg>`;
}

function emptyChart(w,h){
  const L=44,R=10,T=8,B=22;let s=`<svg width="${w}" height="${h}" role="img" aria-label="Empty chart"><g font-size="12" fill="#5b5e5c">`;
  for(let i=0;i<=4;i++){const y=T+(h-T-B)*(1-i/4);s+=`<line x1="${L}" x2="${w-R}" y1="${y}" y2="${y}" stroke="${i?'#e5e7e2':'#9da099'}"/><text x="${L-8}" y="${y+4}" text-anchor="end">${i?i*5+"k":"0"}</text>`}
  return s+'</g></svg>';
}

  };
  const name=SETS.find(x=>x[0]===p)[1];
  return `<main class="sheet flush" style="grid-template-columns:260px 1fr"><section class="master"><div class="hd"><h2>Settings</h2><p>Saved as you change them.</p></div><div class="mlist" role="listbox" aria-label="Settings sections">${side}</div></section><section class="detail"><div class="titlerow" style="margin-bottom:20px"><div><h2 style="font-size:18px;line-height:24px">${name}</h2></div></div>${P[p]}</section></main>`;
}

function scrSetup(){
  return sheet(`<div class="titlerow"><div><h2>Set up wealth tracking</h2><p>Price Check already works. These three steps unlock net worth, Sessions and Snapshots.</p></div></div>
  <div class="steps">
   <div class="step cur"><span class="ix">1</span><div class="b"><h3>Sign in with GGG</h3><p>Your browser opens the official GGG page. Lootwise never sees your password, and the sign-in lasts 10 hours.</p><div><button class="btn primary">Sign in with GGG</button></div></div></div>
   <div class="step"><span class="ix">2</span><div class="b"><h3>Pick your League</h3><p>Defaults to the current challenge League.</p><div><button class="sel">Allflame ${chev}</button></div></div></div>
   <div class="step"><span class="ix">3</span><div class="b"><h3>Choose stash tabs</h3><p>Available after signing in. Every tab except remove-only tabs is selected by default.</p>
     <div class="panel" style="padding:8px 16px">${D.tabs.map(t=>`<div class="prow"><span class="cb ${t.removeOnly?'':'on'}" style="opacity:.55"></span><span class="t muted">${t.name}</span>${t.removeOnly?'<span class="pill">Remove-only</span>':''}</div>`).join('')}</div></div></div>
  </div>`);
}

/* ---------------- overlays on a flat stand-in game ---------------- */
function gameBg(mode,hover){
  let s=`<svg class="bg" width="1280" height="798" viewBox="0 0 1280 798" aria-hidden="true"><rect width="1280" height="798" fill="#15171b"/>`;
  s+=`<rect x="0" y="560" width="1280" height="238" fill="#101216"/>`;
  s+=`<circle cx="96" cy="700" r="58" fill="#5a1f22"/><circle cx="96" cy="722" r="58" fill="#15171b" opacity=".35"/><circle cx="1184" cy="700" r="58" fill="#1f3a5a"/>`;
  for(let i=0;i<10;i++)s+=`<rect x="${300+i*66}" y="722" width="52" height="52" rx="6" fill="#1b1e24" stroke="#2a2e36"/>`;
  if(mode==='stash'){
    s+=`<rect x="64" y="40" width="508" height="560" rx="6" fill="#1a1d23" stroke="#2c3038"/>`;
    for(let r=0;r<12;r++)for(let c=0;c<12;c++)s+=`<rect x="${88+c*40}" y="${64+r*40}" width="38" height="38" fill="#1e2127" stroke="#272b32"/>`;
    const items=[[0,0,2,3,'#3a4a5c'],[2,0,2,2,'#4a3a58'],[4,1,1,1,'#5c4a2a'],[5,0,2,4,'#2e4a42'],[7,2,1,1,'#5c3a3a'],[0,4,2,2,'#4a4a30'],[2,3,2,3,'#33415c'],[8,0,3,2,'#4a3040'],[8,3,2,2,'#2e4a42'],[0,7,4,2,'#3a4a5c'],[5,6,2,2,'#5c4a2a'],[9,6,1,3,'#4a3a58'],[3,9,3,2,'#33415c']];
    items.forEach(([c,r,w,h,col],i)=>{const hov=i===hover;s+=`<rect x="${88+c*40+2}" y="${64+r*40+2}" width="${w*40-6}" height="${h*40-6}" rx="3" fill="${col}" stroke="${hov?'#e8eaed':'#14161a'}" stroke-width="${hov?2:1}"/>`});
    s+=`<rect x="640" y="40" width="520" height="150" rx="6" fill="#1a1d23" stroke="#2c3038"/>`;
    s+=`<path d="M 468 224 l 0 22 l 6 -5 l 5 11 l 4 -2 l -5 -11 l 8 0 z" fill="#f2f3f5" stroke="#15171b" stroke-width="1.5"/>`;
  } else {
    s+=`<rect x="120" y="70" width="560" height="440" rx="8" fill="#1a1d23" stroke="#2c3038"/>`;
    s+=`<text x="400" y="110" text-anchor="middle" font-size="16" fill="#8e929a" font-family="IBM Plex Sans">Divine Font</text>`;
    const gx=[190,330,470];
    const nm=['Molten Strike of the Zenith','Soulrend of Reaping','Viper Strike of the Mamba'];
    gx.forEach((x,i)=>{s+=`<rect x="${x-26}" y="150" width="52" height="52" rx="8" fill="#23353f" stroke="#3a5560"/><text x="${x}" y="232" text-anchor="middle" font-size="13" fill="#b8bcc4" font-family="IBM Plex Sans">${nm[i].split(' of ')[0]}</text><text x="${x}" y="250" text-anchor="middle" font-size="12" fill="#7d8189" font-family="IBM Plex Sans">${nm[i].split(' of ')[1]?'of '+nm[i].split(' of ')[1]:''}</text>`});
    s+=`<rect x="574" y="150" width="52" height="52" rx="8" fill="#2c2630" stroke="#4a3f52"/><text x="600" y="232" text-anchor="middle" font-size="13" fill="#b8bcc4" font-family="IBM Plex Sans">???</text>`;
    s+=`<rect x="330" y="300" width="140" height="120" rx="8" fill="#1d2025" stroke="#2c3038"/><rect x="368" y="318" width="64" height="64" rx="10" fill="#23353f" stroke="#3a5560"/>`;
    s+=`<text x="400" y="404" text-anchor="middle" font-size="12" fill="#7d8189" font-family="IBM Plex Sans">Offered gem</text>`;
  }
  return s+'</svg>';
}
function overlay(kind,id){
  const c=CHECKS.find(x=>x.id===id)||CHECKS.find(x=>x.kind===kind);
  let pos;
  if(c.kind==='gem') pos='left:704px;top:70px';
  else pos='left:482px;top:206px';
  const hover={commodity:2,exchange:4,low:6,stale:0,rare:3,ratelimit:3,none:5,unavail:7}[c.kind];
  return `<div class="game" role="img" aria-label="Stand-in for the game, drawn flat">${gameBg(c.kind==='gem'?'font':'stash',hover)}<div class="gamecard" style="${pos}">${cardFor(c)}</div><div class="gamehud">Stand-in for the game. The card is the only opaque Lootwise surface and never takes focus.</div></div>`;
}

/* ---------------- surfaces & router ---------------- */
const SURF=[
 {id:'overview',g:'screen',l:'Overview',k:'1',r:()=>shell('overview',scrOverview())},
 {id:'checks',g:'screen',l:'Price checks',k:'2',r:()=>shell('checks',scrChecks())},
 {id:'sessions',g:'screen',l:'Sessions',k:'3',r:()=>shell('sessions',scrSessions())},
 {id:'stash',g:'screen',l:'Stash',k:'4',r:()=>shell('stash',scrStash())},
 {id:'settings',g:'screen',l:'Settings',k:'5',r:()=>shell('settings',scrSettings())},
 {id:'first',g:'state',l:'First run',r:()=>shell('overview',scrOverview({firstRun:1}),{firstRun:1})},
 {id:'setup',g:'state',l:'Sign-in and setup',r:()=>shell('overview',scrSetup(),{firstRun:1})},
 {id:'signedout',g:'state',l:'Signed out',r:()=>shell('overview',scrOverview({signedOut:1}),{signedOut:1})},
 {id:'stale',g:'state',l:'Prices stale',r:()=>shell('overview',scrOverview({stale:1}),{stale:1})},
 {id:'loading',g:'state',l:'Loading',r:()=>shell('overview',scrOverview({loading:1}))},
 {id:'o-commodity',g:'overlay',l:'Commodity Item',r:()=>overlay('commodity','h1')},
 {id:'o-low',g:'overlay',l:'Low confidence',r:()=>overlay('low','h3')},
 {id:'o-stale',g:'overlay',l:'Stale relay data',r:()=>overlay('stale','h9')},
 {id:'o-rare',g:'overlay',l:'Rare · Live Search',r:()=>overlay('rare','h5')},
 {id:'o-limit',g:'overlay',l:'Rate-limited',r:()=>overlay('ratelimit','h4')},
 {id:'o-none',g:'overlay',l:'Not a Commodity Item',r:()=>overlay('none','h7')},
 {id:'o-unavail',g:'overlay',l:'League unavailable',r:()=>overlay('unavail','h10')},
 {id:'o-font',g:'overlay',l:'Screen Price Check',r:()=>overlay('gem','h2')},
];
let cur='overview', prev='overview';
function go(id,extra){
  if(!SURF.find(s=>s.id===id)) return;
  if(!id.startsWith('o-')) prev=id; cur=id; Object.assign(ST,extra||{}); render();
}
function render(){
  const s=SURF.find(x=>x.id===cur);
  document.getElementById('win').innerHTML=s.r();
  for(const g of ['screen','state','overlay'])
    document.getElementById('g-'+g).innerHTML=SURF.filter(x=>x.g===g).map(x=>`<button class="chip" data-surf="${x.id}" aria-current="${x.id===cur}">${x.l}${x.k?` <span class="kc">${x.k}</span>`:''}</button>`).join('');
  const sel=document.querySelector('.mrow[aria-selected=true]'); if(sel) sel.scrollIntoView({block:'nearest'});
}
const OVER={commodity:'o-commodity',exchange:'o-commodity',low:'o-low',stale:'o-stale',rare:'o-rare',ratelimit:'o-limit',none:'o-none',unavail:'o-unavail',gem:'o-font'};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-go],[data-surf],[data-open],[data-over],[data-tab],[data-sess],[data-set]'); if(!t) return;
  const d=t.dataset;
  if(d.go) go(d.go); else if(d.surf) go(d.surf);
  else if(d.open){ST.check=d.open; if(cur!=='checks')go('checks'); else render();}
  else if(d.over){const c=CHECKS.find(x=>x.id===d.over);const sid=OVER[c.kind];go(sid);overrideOverlay(c);}
  else if(d.tab!==undefined){ST.tab=+d.tab;render();}
  else if(d.sess){ST.sess=d.sess;render();}
  else if(d.set){ST.set=d.set;render();}
});
function overrideOverlay(c){document.getElementById('win').innerHTML=overlay(c.kind,c.id)}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey) return;
  const k=e.key;
  if('12345'.includes(k)&&k.length===1){go(SURF[+k-1].id);return;}
  if(k==='['||k===']'){const i=SURF.findIndex(s=>s.id===cur);go(SURF[(i+(k==='['?-1:1)+SURF.length)%SURF.length].id);return;}
  if(k==='Escape'&&cur.startsWith('o-')){go(prev);return;}
  if(k==='ArrowDown'||k==='ArrowUp'){
    const d=k==='ArrowDown'?1:-1;
    if(cur==='checks'){const i=Math.max(0,CHECKS.findIndex(c=>c.id===(ST.check||CHECKS[0].id)));ST.check=CHECKS[Math.min(CHECKS.length-1,Math.max(0,i+d))].id;render();e.preventDefault();}
    else if(cur==='sessions'){const i=SESS.findIndex(s=>s.id===ST.sess);ST.sess=SESS[Math.min(SESS.length-1,Math.max(0,i+d))].id;render();e.preventDefault();}
    else if(cur==='settings'){const i=SETS.findIndex(s=>s[0]===ST.set);ST.set=SETS[Math.min(SETS.length-1,Math.max(0,i+d))][0];render();e.preventDefault();}
    else if(cur==='stash'){ST.tab=Math.min(D.tabs.length-1,Math.max(-1,ST.tab+d));render();e.preventDefault();}
  }
  if(k==='Enter'&&cur==='checks'&&document.activeElement===document.body){const c=CHECKS.find(x=>x.id===(ST.check||CHECKS[0].id));go(OVER[c.kind]);overrideOverlay(c);}
});
if(SURF.some(s=>s.id===location.hash.slice(1)))cur=location.hash.slice(1);
function fit(){const st=document.querySelector('.stage');st.style.zoom=Math.min(1,(innerWidth-32)/1280)}
addEventListener('resize',fit);fit();
render();
</script>
