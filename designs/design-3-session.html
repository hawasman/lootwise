<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lootwise · Design 3 · Session companion</title>
<style>
@font-face{font-family:"Inter";font-weight:400;font-style:normal;font-display:swap;src:url(assets/inter-400.ttf) format("truetype")}
@font-face{font-family:"Inter";font-weight:500;font-style:normal;font-display:swap;src:url(assets/inter-500.ttf) format("truetype")}
@font-face{font-family:"Inter";font-weight:600;font-style:normal;font-display:swap;src:url(assets/inter-600.ttf) format("truetype")}
:root{
  /* true-black-flat, cool-monitor ground: elevation by lightness only */
  --ground:#0b0c0e; --surface:#15171a; --raised:#22252a; --raised-2:#2c3036;
  --border:#1a1c20; --rule:#1a1c20; --control:#444a52;
  --text:#fff; --muted:#b4b4b4; --faint:#949494;
  --accent:#c6f24e; --positive:#c6f24e; --negative:#e5484d; --warning:#e5a93b;
  --pill-warning-bg:#2b2414; --pill-warning-ink:#e5a93b;
  --pill-negative-bg:#2c1a20; --pill-negative-ink:#e5566f;
  --pill-neutral-bg:#22252a;
  --radius-card:20px; --gap:14px; --pad:22px;
  --font:"Inter",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#050506;color:var(--text);font-family:var(--font);font-size:14px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}

/* ---------- page chrome: surface switcher ---------- */
.deck{max-width:1320px;margin:0 auto;padding:14px 20px 0}
.deck-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-height:34px}
.deck-row+.deck-row{margin-top:6px}
.deck button{height:30px;padding:0 13px;border-radius:999px;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.deck button:hover{color:#fff}
.deck button[aria-pressed=true]{background:#fff;color:#000}
.deck .grp button[aria-pressed=true]{background:var(--raised-2);color:#fff}
.deck .grp button[aria-pressed=true].sub{background:#fff;color:#000}
.deck .hint{margin-left:auto;color:var(--faint);font-size:12px}
.stagewrap{max-width:1320px;margin:12px auto 40px;padding:0 20px}
.fit{width:1280px;height:800px;transform-origin:0 0}
.fitbox{width:1280px;height:800px;position:relative;overflow:hidden}

/* ---------- window ---------- */
.win{width:1280px;height:800px;background:var(--ground);border-radius:12px;overflow:hidden;position:relative;display:flex;flex-direction:column;border:1px solid #1c1f24}
.titlebar{height:32px;flex:none;display:flex;align-items:center;padding:0 14px;color:var(--faint);font-size:12px;background:#08090a}
.titlebar .ctl{margin-left:auto;display:flex;gap:18px;align-items:center}
.titlebar .ctl i{display:block;width:10px;height:10px;border:1px solid var(--faint);border-radius:2px}
.titlebar .ctl i:first-child{border:0;border-top:1px solid var(--faint);height:0;margin-top:8px;border-radius:0}
.titlebar .ctl i:last-child{border:0;position:relative}
.titlebar .ctl i:last-child:before,.titlebar .ctl i:last-child:after{content:"";position:absolute;left:4px;top:-1px;width:1px;height:12px;background:var(--faint);transform:rotate(45deg)}
.titlebar .ctl i:last-child:after{transform:rotate(-45deg)}
.app{flex:1;display:flex;min-height:0}
.side{width:210px;flex:none;border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:0 12px 16px}
.brand{height:64px;display:flex;align-items:center;gap:10px;padding:0 10px;border-bottom:1px solid var(--rule);margin:0 -12px 16px;padding-left:22px}
.brand .mark{width:24px;height:24px;flex:none}
.brand b{font-size:16px;font-weight:600;letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:0}
.nav button{height:34px;text-align:left;padding:0 10px;color:#bbb;font-size:14px;font-weight:500;border-radius:8px;display:flex;align-items:center;justify-content:space-between}
.nav button:hover{color:#fff}
.nav button[aria-current=page]{color:#fff}
.nav .count{font-size:12px;color:var(--faint);font-weight:400}
.side .spacer{flex:1}
.acct{padding:10px;font-size:12px;color:var(--faint);line-height:1.5}
.acct b{display:block;color:var(--muted);font-weight:500;font-size:13px}
.acct .pip{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.acct .pip.warn{background:var(--warning)}
.acct .pip.off{background:var(--control)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;flex:none;border-bottom:1px solid var(--rule);display:flex;align-items:center;padding:0 0 0 29px}
.topbar h1{font-size:20px;font-weight:600;letter-spacing:0;white-space:nowrap}
.topbar .sub{color:var(--muted);font-size:14px;margin-left:14px;white-space:nowrap}
.topbar .grow{flex:1}
.topbar .acts{display:flex;align-items:center;gap:10px;padding-right:20px}
.topbar .scope{height:64px;border-left:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center;padding:0 22px;min-width:190px}
.scope small{font-size:12px;color:var(--faint)}
.scope span{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.chev{width:7px;height:7px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:rotate(45deg);margin-top:-3px}
.canvas{flex:1;min-height:0;padding:20px 29px 24px;overflow:hidden;position:relative}
.canvas.scroll{overflow-y:auto}
.canvas.scroll::-webkit-scrollbar{width:8px}.canvas.scroll::-webkit-scrollbar-thumb{background:var(--raised-2);border-radius:4px}

/* ---------- controls ---------- */
.btn{height:36px;padding:0 18px;border-radius:999px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.primary{background:#fff;color:#000}
.btn.primary:hover{background:#e6e6e6}
.btn.second{background:var(--raised);color:#fff}
.btn.second:hover{background:var(--raised-2)}
.btn.ghost{color:var(--muted)} .btn.ghost:hover{color:#fff}
.btn.sm{height:30px;padding:0 14px;font-size:13px}
.seg{display:inline-flex;background:var(--raised);border-radius:999px;padding:3px;gap:2px}
.seg button{height:30px;padding:0 16px;border-radius:999px;color:var(--muted);font-size:13px;font-weight:500}
.seg button[aria-pressed=true]{background:var(--raised-2);color:#fff}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--pill-neutral-bg);color:#fff;white-space:nowrap}
.pill.warn{background:var(--pill-warning-bg);color:var(--pill-warning-ink)}
.pill.bad{background:var(--pill-negative-bg);color:var(--pill-negative-ink)}
.chk{width:18px;height:18px;border-radius:5px;background:var(--raised-2);flex:none;position:relative;display:inline-block}
.chk.on{background:#fff}
.chk.on:after{content:"";position:absolute;left:6px;top:2.5px;width:5px;height:9px;border-right:2px solid #000;border-bottom:2px solid #000;transform:rotate(40deg)}
.sw{width:34px;height:20px;border-radius:999px;background:var(--raised-2);position:relative;flex:none;display:inline-block}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--muted)}
.sw.on{background:#fff}.sw.on:after{left:17px;background:#000}
.key{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:7px;background:var(--raised-2);font-size:13px;font-weight:500}
.select{height:36px;border-radius:999px;background:var(--raised);padding:0 16px;display:inline-flex;align-items:center;gap:12px;font-weight:500;font-size:14px}
.card{background:var(--surface);border-radius:var(--radius-card);padding:var(--pad)}
.lab{font-size:14px;color:var(--muted)}
.rule{height:1px;background:var(--rule)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--raised-2);border-top-color:#fff;animation:sp .9s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.bar{height:6px;border-radius:999px;background:var(--raised-2);overflow:hidden}
.bar i{display:block;height:100%;background:#e6e6e6;border-radius:999px}
.bar i.lime{background:var(--accent)}

/* ---------- Session (the glance view) ---------- */
.hero{display:grid;grid-template-columns:1fr 1px 342px;gap:0;padding:0;height:312px}
.hero .big{padding:26px 30px;display:flex;flex-direction:column;min-width:0}
.hero .rail{background:var(--rule);margin:26px 0}
.hero .side3{padding:22px 0 22px 30px;display:flex;flex-direction:column;justify-content:space-between}
.fig-label{font-size:14px;color:var(--muted)}
.hero-fig{font-size:132px;line-height:1;font-weight:600;letter-spacing:-.02em;color:var(--accent);margin-top:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero-fig small{font-size:36px;font-weight:500;letter-spacing:0;color:var(--muted);margin-left:12px}
.hero-sub{font-size:16px;color:var(--muted);margin-top:14px}
.hero-sub b{color:#fff;font-weight:500}
.m3 .v{font-size:44px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.m3 .v small{font-size:18px;font-weight:500;color:var(--muted);margin-left:6px}
.m3 .s{font-size:13px;color:var(--faint);margin-top:2px}
.m3 .v.pos{color:#fff}
.chartcard{margin-top:var(--gap);padding:18px 22px 14px;display:flex;flex-direction:column}
.chead{display:flex;align-items:baseline;gap:14px}
.chead h2{font-size:16px;font-weight:600}
.chead .r{margin-left:auto;display:flex;align-items:center;gap:12px}
.banner{display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:14px;background:var(--pill-warning-bg);color:var(--pill-warning-ink);font-weight:500;margin-bottom:var(--gap)}
.banner span.t{flex:1;color:#f0c66e}
.banner .btn{flex:none}
.banner.bad{background:var(--pill-negative-bg)}.banner.bad span.t{color:#f08a9b}

/* ---------- history, snapshots, tables ---------- */
.row2{display:grid;gap:var(--gap)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-weight:400;color:var(--faint);font-size:12px;text-align:left;height:34px;padding:0 10px;white-space:nowrap}
td{height:38px;padding:0 10px;border-top:1px solid var(--rule);font-size:14px;white-space:nowrap}
th.r,td.r{text-align:right}
td.name{white-space:normal}
td .sm{font-size:12px;color:var(--faint);margin-left:8px}
tr.sel td{background:var(--raised)}
.slist button{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;height:52px;padding:0 14px;border-radius:12px;color:var(--muted)}
.slist button:hover{background:var(--raised)}
.slist button[aria-pressed=true]{background:var(--raised);color:#fff}
.slist .t{font-weight:500;font-size:14px}
.slist .d{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;text-align:right}
.slist .v{font-variant-numeric:tabular-nums;text-align:right;font-weight:500}
.barrow{display:grid;grid-template-columns:150px 1fr 120px;align-items:center;gap:16px;height:44px;border-top:1px solid var(--rule)}
.barrow:first-child{border-top:0}
.tablewrap{overflow-y:auto}
.tablewrap::-webkit-scrollbar{width:8px}.tablewrap::-webkit-scrollbar-thumb{background:var(--raised-2);border-radius:4px}
thead th{position:sticky;top:0;background:var(--surface);z-index:1}

/* ---------- settings / setup ---------- */
.set{display:grid;grid-template-columns:300px 1fr;gap:28px;padding:22px 0;border-top:1px solid var(--rule)}
.set:first-child{border-top:0;padding-top:0}
.set h3{font-size:16px;font-weight:600}
.set p{color:var(--muted);font-size:14px;margin-top:4px}
.ctl-row{display:flex;align-items:center;gap:12px;min-height:36px;flex-wrap:wrap}
.ctl-row+.ctl-row{margin-top:10px}
.ctl-row .grow{flex:1;min-width:0}
.ctl-row .t{font-weight:500}
.ctl-row .d{font-size:13px;color:var(--faint)}
.step{display:grid;grid-template-columns:36px 1fr;gap:6px 14px;padding:22px 0;border-top:1px solid var(--rule)}
.step:first-child{border-top:0;padding-top:0}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font-weight:600;font-size:13px}
.step .n.done{background:#fff;color:#000}
.step h3{font-size:16px;font-weight:600;line-height:28px}
.step .body{grid-column:2}
.step p{color:var(--muted)}
.tabs-list{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.tabs-list label{display:flex;align-items:center;gap:12px;height:42px;border-top:1px solid var(--rule);cursor:pointer}
.tabs-list .d{margin-left:auto;font-size:12px;color:var(--faint)}

/* ---------- game stand-in + overlay ---------- */
.game{width:1280px;height:800px;position:relative;overflow:hidden;border-radius:12px;background:#17120e}
.game>svg{position:absolute;inset:0}
.ov{position:absolute;width:320px;background:var(--surface);border-radius:16px;padding:18px 18px 14px;border:1px solid #2a2d33;color:#fff}
.ov .price{display:flex;align-items:baseline;gap:10px;line-height:1}
.ov .price b{font-size:52px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ov .price b small{font-size:22px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.ov .price .alt{margin-left:auto;font-size:16px;color:var(--muted);font-variant-numeric:tabular-nums}
.ov .iname{font-size:14px;font-weight:500;margin-top:12px}
.ov .imeta{font-size:12px;color:var(--faint);margin-top:2px}
.ov .facts{font-size:12px;color:var(--muted);margin-top:10px;font-variant-numeric:tabular-nums}
.ov .trend{display:flex;align-items:center;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.ov .trend b{color:#fff;font-weight:500;font-variant-numeric:tabular-nums}
.ov .foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:11px;border-top:1px solid var(--rule);font-size:12px;color:var(--faint)}
.ov .foot a{color:var(--muted);text-decoration:none}
.ov .foot a:hover{color:#fff}
.ov .why{margin-top:10px;font-size:13px;color:var(--muted);line-height:1.45}
.ov .dash{color:var(--faint)}
.ov .flt{margin-top:14px;border-top:1px solid var(--rule)}
.ov .flt .f{display:flex;align-items:center;gap:10px;height:36px;border-bottom:1px solid var(--rule);font-size:13px}
.ov .flt .f .l{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov .flt .f.off .l{color:var(--faint)}
.ov .flt .f.off .v{color:var(--faint)}
.ov .flt .v{width:52px;height:26px;border-radius:7px;background:var(--raised);text-align:right;padding:0 8px;line-height:26px;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;flex:none}
.ov .flt .f.dim{opacity:.45}
.ov .go{margin-top:14px;display:flex;gap:10px;align-items:center}
.ov .go .btn{flex:1;justify-content:center}
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 10px;padding:11px 12px;border-radius:12px}
.opt.first{background:var(--raised)}
.opt .g{font-size:14px;font-weight:500}
.opt .p{font-size:24px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;line-height:1.1}
.opt .p small{font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.opt .s{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.opt .s2{font-size:12px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
.opt.none .p{color:var(--faint)}
.opt+.opt{margin-top:2px}
.opt.first .p{font-size:36px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cap{position:absolute;left:480px;bottom:70px;font-size:12px;color:#8a7d6f}
</style>
</head>
<body>
<div class="deck" id="deck" aria-label="Surfaces"></div>
<div class="stagewrap"><div class="fitbox" id="fitbox"><div class="fit" id="fit"><div id="view"></div></div></div></div>

<script>
/* =============== DATA (prices: Allflame relay mirror, poe.ninja / Currency Exchange) =============== */
const DIV = 502.5;                         // chaos per divine: 1 / exchange-Currency rates.divine (0.00199)
const TIMES = ['18:14','18:24','18:34','18:44','18:54','19:04'];
const ITEMS = [ // tab, name, unit chaos, quantity at each of the 6 Snapshots
  ['Currency','Divine Orb',502.5,[3,3,4,4,5,5]],
  ['Currency','Exalted Orb',5.16,[120,131,140,152,167,181]],
  ['Currency','Stacked Deck',7.19,[30,30,33,35,36,38]],
  ['Currency','Gemcutter\u2019s Prism',4.62,[40,41,43,44,47,49]],
  ['Currency','Orb of Scouring',1.33,[210,224,231,250,262,280]],
  ['Currency','Chaos Orb',1,[1450,1530,1610,1720,1790,1880]],
  ['Scarabs','Horned Scarab of Preservation',604,[0,0,1,1,1,2]],
  ['Scarabs','Horned Scarab of Bloodlines',118.6,[2,2,3,3,4,4]],
  ['Scarabs','Harvest Scarab of Cornucopia',60.48,[6,7,7,9,10,11]],
  ['Scarabs','Cartography Scarab of Risk',43.76,[8,9,11,12,13,15]],
  ['Delirium','Essence of Delirium',115.4,[1,2,2,3,3,3]],
  ['Delirium','Golden Oil',311.6,[0,0,0,1,1,1]],
  ['Gems','Pact of Beidat 20/20c',1005,[0,0,0,0,1,1]],
  ['Gems','Soulrend of Reaping 20/20c',150,[1,1,1,1,1,1]],
  ['Uniques','Voidforge, Infernal Sword',24371,[1,1,1,1,1,1]],
];
const TABS = ['Currency','Scarabs','Delirium','Gems','Uniques'];
const UNPRICED = [ // rares are never priced in Snapshots
  ['Uniques','Rare Sorcerer Boots',3],['Uniques','Rare Vaal Regalia',2],['Uniques','Rare Hubris Circlet',1],
  ['Gems','Rare Cobalt Jewel',4],['Delirium','Rare Ruby Ring',2],['Scarabs','Rare Heavy Belt',2]];
const UNPRICED_N = UNPRICED.reduce((s,r)=>s+r[2],0);
const snap = i => {
  const rows = ITEMS.map(([tab,name,unit,q])=>({tab,name,unit,qty:q[i],value:Math.round(q[i]*unit)})).filter(r=>r.qty>0);
  const byTab = TABS.map(t=>({tab:t,items:rows.filter(r=>r.tab===t).length,value:rows.filter(r=>r.tab===t).reduce((s,r)=>s+r.value,0)}));
  return {i,time:TIMES[i],rows,byTab,total:rows.reduce((s,r)=>s+r.value,0)};
};
const SNAPS = TIMES.map((_,i)=>snap(i));
SNAPS.forEach(s=>console.assert(s.total===s.byTab.reduce((a,t)=>a+t.value,0),'tab sum = snapshot total'));
const FIRST = SNAPS[0], LAST = SNAPS[5];
const MEASURED_MIN = 50;                                   // 18:14 -> 19:04, first to last Snapshot
const DELTA = LAST.total - FIRST.total;                    // chaos, from the totals as shown
const PERHOUR = Math.round(DELTA / (MEASURED_MIN/60));     // chaos per hour
const n0 = v => Math.round(v).toLocaleString('en-US');
const d1 = c => (c/DIV).toFixed(1);
const sign = v => (v>=0?'+':'\u2212')+n0(Math.abs(v));
const signd = c => (c>=0?'+':'\u2212')+(Math.abs(c)/DIV).toFixed(1);
// League history (sample): last Snapshot of each day; last point is today's 19:04 Snapshot
const DAYS = ['Oct 29','Oct 30','Oct 31','Nov 1','Nov 2','Nov 3','Nov 4','Nov 5','Nov 6','Nov 7','Nov 8','Nov 9'];
const HIST = [0.16,0.23,0.30,0.29,0.41,0.49,0.56,0.64,0.71,0.80,0.93].map(f=>Math.round(FIRST.total*f/100)*100).concat([LAST.total]);
const PAST = [ // sample sessions: measured minutes between first and last Snapshot, net worth change in chaos
  {start:'Nov 8, 20:02',min:160,snaps:17,delta:21480,note:''},
  {start:'Nov 7, 19:30',min:90,snaps:10,delta:7240,note:''},
  {start:'Nov 6, 21:10',min:70,snaps:8,delta:null,note:'Tabs differ'},
];
console.assert(LAST.total-FIRST.total===DELTA);

/* =============== helpers =============== */
const mark = `<svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20 L3 4 L8 4 L8 15 L21 15 L21 20 Z" fill="#c6f24e"/></svg>`;
const niceTicks = (lo,hi,n=4)=>{ const raw=(hi-lo)/n; const p=Math.pow(10,Math.floor(Math.log10(raw))); const m=[1,2,2.5,5,10].find(x=>x*p>=raw)*p; const a=Math.floor(lo/m)*m, ticks=[]; for(let v=a;v<=hi+m;v+=m){ticks.push(v); if(v>=hi)break;} return ticks; };

function lineChart({w,h,pts,xDomain,xTicks,yLabel,ref,markNext,lastDot=true,yUnit='div',padL=52,padB=26,padT=10,padR=18}){
  const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
  const yt=niceTicks(Math.min(...ys,ref?ref.y:Infinity),Math.max(...ys),3);
  const y0=yt[0], y1=yt[yt.length-1];
  const X=x=>padL+(x-xDomain[0])/(xDomain[1]-xDomain[0])*(w-padL-padR);
  const Y=y=>padT+(1-(y-y0)/(y1-y0))*(h-padT-padB);
  let s=`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${yLabel}">`;
  yt.forEach(v=>{ s+=`<line x1="${padL}" x2="${w-padR}" y1="${Y(v)}" y2="${Y(v)}" stroke="#22252a"/><text x="${padL-10}" y="${Y(v)+4}" text-anchor="end" fill="#949494" font-size="12" font-family="Inter" style="font-variant-numeric:tabular-nums">${yUnit==='div'?Math.round(v/DIV):n0(v)}</text>`;});
  s+=`<line x1="${padL}" x2="${w-padR}" y1="${Y(y0)}" y2="${Y(y0)}" stroke="#444a52" stroke-width="1"/>`;
  xTicks.forEach(t=>{ s+=`<text x="${X(t.x)}" y="${h-6}" text-anchor="${t.a||'middle'}" fill="#949494" font-size="12" font-family="Inter" style="font-variant-numeric:tabular-nums">${t.l}</text>`;});
  if(ref){ s+=`<line x1="${X(xDomain[0])}" x2="${w-padR}" y1="${Y(ref.y)}" y2="${Y(ref.y)}" stroke="#6b6b6b" stroke-dasharray="4 4"/><text x="${w-padR}" y="${Y(ref.y)+(ref.below?16:-6)}" text-anchor="end" fill="#949494" font-size="12" font-family="Inter">${ref.l}</text>`; }
  if(markNext){ s+=`<line x1="${X(markNext.x)}" x2="${X(markNext.x)}" y1="${padT}" y2="${h-padB}" stroke="#444a52" stroke-dasharray="3 4"/>`; }
  s+=`<polyline fill="none" stroke="#c6f24e" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>X(p.x)+','+Y(p.y)).join(' ')}"/>`;
  if(lastDot){ const p=pts[pts.length-1]; s+=`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="5" fill="#c6f24e"/>`; }
  s+='</svg>'; return {svg:s,X,Y};
}
// Session strip: one tick on the time axis for every Snapshot
function sessionChart(){
  const pts=SNAPS.map((s,i)=>({x:i*10,y:s.total}));
  const w=968,h=272,padL=52,padR=18,padB=26;
  const c=lineChart({w,h,pts,xDomain:[0,60],xTicks:[0,10,20,30,40,50,60].map(m=>({x:m,l:m===60?'19:14':TIMES[m/10]||''})),yLabel:'Net worth this Session in divines',ref:{y:FIRST.total,l:'Net worth at 18:14: '+d1(FIRST.total)+' div',below:true},markNext:{x:60}});
  let ticks='';
  pts.forEach(p=>{ ticks+=`<line x1="${c.X(p.x)}" x2="${c.X(p.x)}" y1="${h-padB}" y2="${h-padB+6}" stroke="#fff" stroke-width="2"/>`; });
  return c.svg.replace('</svg>',ticks+`<text x="${c.X(60)-8}" y="22" text-anchor="end" fill="#949494" font-size="12" font-family="Inter">Next Snapshot</text></svg>`);
}
function leagueChart(){
  const pts=HIST.map((v,i)=>({x:i,y:v}));
  const w=1012-44,h=250;
  const c=lineChart({w,h,pts,xDomain:[0,11],xTicks:DAYS.map((d,i)=>({x:i,l:i%2===0||i===11?d:'',a:i===0?'start':i===11?'end':'middle'})),yLabel:'Net worth at the last Snapshot of each day, in divines'});
  return c.svg;
}
function trend7(data,w=150,h=30){
  const lo=Math.min(...data),hi=Math.max(...data);
  const X=i=>2+i/(data.length-1)*(w-4), Y=v=>2+(1-(v-lo)/(hi-lo||1))*(h-4);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="7-day trend"><polyline fill="none" stroke="#c6f24e" stroke-width="2" stroke-linejoin="round" points="${data.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/></svg>`;
}

  const blocks=[[0,0,2,1,'#3a2f4a'],[2,0,1,1,'#4a3a22'],[3,0,1,1,'#2b3f5a'],[4,0,2,2,'#5a2b2b'],[0,1,1,2,'#2b3f5a'],[1,1,1,1,'#4a3a22'],[2,1,2,1,'#4a3a22'],[6,0,1,1,'#4a3a22'],[7,0,1,1,'#2b3f5a'],[8,0,1,1,'#4a3a22'],[9,0,3,1,'#5a2b2b'],[6,2,2,2,'#3a2f4a'],[0,3,1,1,'#4a3a22'],[1,3,1,1,'#4a3a22'],[2,3,2,2,'#2b3f5a'],[8,2,1,3,'#5a2b2b'],[9,2,1,1,'#2b3f5a'],[10,2,2,2,'#5a2b2b'],[4,4,3,1,'#4a3a22'],[9,3,1,1,'#4a3a22'],[0,4,2,1,'#3a2f4a']];
  blocks.forEach(([c,r,w,h,col])=>{ g+=`<rect x="${ix+c*cs}" y="${iy+r*cs}" width="${w*cs-2}" height="${h*cs-2}" fill="${col}"/>`; });
  const hx=ix+cur.c*cs, hy=iy+cur.r*cs;
  g+=`<rect x="${hx-1}" y="${hy-1}" width="${cur.w*cs}" height="${cur.h*cs}" fill="none" stroke="#e9dcc2" stroke-width="2"/>`;
  const cx=hx+cur.w*cs/2+8, cy=hy+cur.h*cs/2+8;
  return {svg:`<svg width="1280" height="800" viewBox="0 0 1280 800" aria-hidden="true">
   <rect width="1280" height="800" fill="#17120e"/>

   ${[0,1,2,3,4].map(i=>`<rect x="${430+i*76}" y="750" width="52" height="42" fill="#1b1612"/>`).join('')}
   ${g}
   <path d="M${cx} ${cy} l0 22 l6 -5 l4 10 l4 -2 l-4 -10 l8 0 z" fill="#fff" stroke="#000" stroke-width="1"/>
  </svg>`,cx,cy};
}

/* =============== surface registry + deck =============== */
const SURFACES = [
  ['Window','session','Session'],['Window','history','History'],['Window','snapshot','Snapshot'],['Window','settings','Settings'],
  ['Setup','signin','Sign-in and tabs'],['Setup','firstrun','First run'],
  ['Overlay','ov-commodity','Price'],['Overlay','ov-low','Low confidence'],['Overlay','ov-rare','Rare, Live Search'],['Overlay','ov-notcommodity','Not a Commodity Item'],['Overlay','ov-unavail','League unavailable'],['Overlay','ov-rate','Rate-limited'],['Overlay','ov-screen','Screen Price Check'],
  ['States','stale','Relay stale'],['States','signedout','Signed out'],['States','loading','Loading'],['States','warning','Tabs differ'],
];
const ROUTE = {session:'Window',history:'Window',snapshot:'Window',settings:'Window',signin:'Setup',firstrun:'Setup'};
let cur = 'session';
function deck(){
  const groups=[...new Set(SURFACES.map(s=>s[0]))];
  const g=SURFACES.find(s=>s[1]===cur)[0];
  document.getElementById('deck').innerHTML=
   `<div class="deck-row grp">${groups.map(x=>`<button data-grp="${x}" aria-pressed="${x===g}">${x}</button>`).join('')}<span class="hint">\u2190 \u2192 switch surface \u00b7 Lootwise design 3, optimised for the second monitor</span></div>
    <div class="deck-row grp">${SURFACES.filter(s=>s[0]===g).map(s=>`<button class="sub" data-s="${s[1]}" aria-pressed="${s[1]===cur}">${s[2]}</button>`).join('')}</div>`;
}
function show(id){
  if(!VIEWS[id]) return; cur=id; history.replaceState(null,'','#'+id);
  document.getElementById('view').innerHTML=VIEWS[id](); deck(); fitWin(); tick(true);
}
function fitWin(){
  const box=document.getElementById('fitbox'), fit=document.getElementById('fit');
  const k=Math.min(1,(box.parentElement.clientWidth-40)/1280);
  fit.style.transform=`scale(${k})`; box.style.width=1280*k+'px'; box.style.height=800*k+'px';
}
let t0=Date.now();
function tick(first){
  const s=3128+Math.floor((Date.now()-t0)/1000);
  const f=`${Math.floor(s/3600)}:${String(Math.floor(s/60)%60).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  document.querySelectorAll('.clk').forEach(e=>e.textContent=f);
}
setInterval(tick,1000);
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-s],[data-grp],[data-go],[data-snap],[data-sv],#tabs label,[data-act]'); if(!b) return;
  if(b.dataset.s) show(b.dataset.s);
  else if(b.dataset.grp) show(SURFACES.find(s=>s[0]===b.dataset.grp)[1]);
  else if(b.dataset.go) show(b.dataset.go);
  else if(b.dataset.snap){snapSel=+b.dataset.snap;show('snapshot');}
  else if(b.dataset.sv){snapView=b.dataset.sv;show('snapshot');}
  else if(b.matches('#tabs label')){e.preventDefault();b.querySelector('.chk').classList.toggle('on');const n=document.querySelectorAll('#tabs .chk.on').length;b.closest('.body').lastElementChild.textContent=n+' of 6 tabs selected';}
  else if(b.dataset.act==='stop'){show('firstrun');}
  else if(b.dataset.act==='retry'){show('session');}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft') return;
  const i=SURFACES.findIndex(s=>s[1]===cur); const n=(i+(e.key==='ArrowRight'?1:-1)+SURFACES.length)%SURFACES.length;
  show(SURFACES[n][1]);
});
window.addEventListener('resize',fitWin);
show((location.hash||'#session').slice(1)||'session');
